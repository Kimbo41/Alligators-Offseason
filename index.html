<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alligators Offseason</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Alligators">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F0F0; --card:#FFFFFF; --ink:#141112; --mute:#6B6466; --line:#DDD8D9;
  --dark:#991921; --red:#BB1F1D; --gold:#BA9549; --black:#000000;
  --accent:#991921; --accent-ink:#FFFFFF; --done:#F5EDDA; --goldtxt:#8A6A27;
  --head:"Barlow Condensed","Arial Narrow",Arial,sans-serif; --body:"Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0B0A0A; --card:#171415; --ink:#F3EFEF; --mute:#A89FA1; --line:#2D2829; --accent:#BB1F1D; --done:#2E2615; --goldtxt:#D4B26A;}}
:root[data-theme="dark"]{--bg:#0B0A0A; --card:#171415; --ink:#F3EFEF; --mute:#A89FA1; --line:#2D2829; --accent:#BB1F1D; --done:#2E2615; --goldtxt:#D4B26A;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
.brand{background:var(--black);border-bottom:3px solid var(--accent);padding:10px 14px;display:flex;align-items:center;gap:12px}
.plate{background:#fff;border-radius:10px;padding:4px 10px;flex:0 0 auto;display:flex}
.plate img{height:42px;width:auto;display:block}
.who{min-width:0;color:#fff}
.who b{display:block;font-family:var(--head);font-size:22px;line-height:1.05;letter-spacing:.2px}
.who span{display:block;color:var(--gold);font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrl{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 14px 8px;border-bottom:1px solid var(--line)}
.weeks{display:flex;gap:6px;overflow-x:auto;margin:0 -14px;padding:0 14px 2px;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.wk{flex:0 0 auto;min-width:44px;min-height:40px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-family:var(--head);font-size:20px;font-weight:700}
.wk[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.wk.deload{border-style:dashed}
.days{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:8px}
.day{position:relative;min-height:44px;border:1px solid var(--line);background:var(--card);border-radius:8px;font-weight:600}
.day[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 -3px 0 var(--gold)}
.day .dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
main{padding:14px 14px calc(92px + env(safe-area-inset-bottom,0px));max-width:640px;margin:0 auto}
.dtitle{display:flex;justify-content:space-between;align-items:baseline;margin:2px 0 4px}
.dtitle h2{font-family:var(--head);font-size:26px;margin:0;line-height:1.1}
.prog{color:var(--mute);font-weight:600;font-size:14px}
.sub{color:var(--mute);font-size:14px;margin:0 0 12px}
.ex{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px 12px;margin-bottom:10px}
.exh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.exh b{font-size:17px;display:block}
.tgt{color:var(--mute);font-size:14px;display:block;margin-top:1px}
.lbl,.set{display:grid;grid-template-columns:26px 1fr 1fr 52px;gap:8px;align-items:center}
.lbl{color:var(--mute);font-size:12px;margin-top:4px}
.lbl span{text-align:center}
.set{padding:4px 0}
.set .n{color:var(--mute);font-weight:600;text-align:center}
input[type=number],input[type=text]{width:100%;min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:18px;font-weight:600;text-align:center;padding:0 8px}
input::placeholder{color:var(--mute);opacity:.8}
input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.chk{min-height:44px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:22px;font-weight:700;color:var(--mute)}
.set.done input{background:var(--done);border-color:var(--gold)}
.set.done .chk{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.exnote{margin-top:8px;text-align:left!important;font-weight:500!important;font-size:15px!important}
.feelbox{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:10px;padding:12px;margin-top:14px}
.feelbox h3{margin:0 0 2px;font-family:var(--head);font-size:21px}
.hint{color:var(--mute);font-size:13px;margin:0 0 10px}
.fl{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.fl button{min-height:48px;border:1px solid var(--line);background:var(--bg);border-radius:8px;font-weight:700;font-size:19px}
.fl button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fsel{min-height:20px;margin:8px 0 0;font-weight:600;color:var(--goldtxt);font-size:14px}
.feelbox input[type=text]{text-align:left;font-weight:500;font-size:16px;margin-top:6px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.card h3{font-family:var(--head);font-size:22px;margin:0 0 8px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:7px 8px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:600;font-size:13px}
td:first-child,th:first-child{text-align:left}
.bar{display:grid;grid-template-columns:34px 1fr 54px;gap:8px;align-items:center;margin:5px 0;font-size:14px}
.bar i{display:block;height:14px;border-radius:4px;background:var(--accent)}
.bar.g i{background:var(--gold)}
.bar span:last-child{text-align:right;font-weight:600}
.btn{width:100%;min-height:48px;border-radius:10px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px}
.small{color:var(--mute);font-size:13px;margin:8px 0 0}
.empty{color:var(--mute);padding:6px 0}
.player{display:flex;gap:14px;align-items:center}
.num{font-family:var(--head);font-size:44px;font-weight:700;line-height:1;color:var(--accent);min-width:56px;text-align:center}
.player b{font-size:18px;display:block}
.player span{color:var(--mute);font-size:14px}
.field{display:block;margin-bottom:14px}
.field>span{display:block;font-weight:600;margin-bottom:6px;font-size:15px}
.field input{text-align:left;font-weight:500}
.nudge{display:block;width:100%;text-align:left;background:var(--done);border:1px solid var(--gold);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:14px}
nav.bar-nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--black);display:grid;grid-template-columns:repeat(3,1fr);padding:0 0 env(safe-area-inset-bottom,0px)}
nav.bar-nav button{min-height:56px;background:none;border:0;border-top:3px solid transparent;color:#B9B2B3;font-weight:600;font-size:15px}
nav.bar-nav button[aria-pressed="true"]{color:#fff;border-top-color:var(--gold)}

.acts{display:flex;flex:0 0 auto;margin:-4px -4px 0 0}
.ib{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:8px;color:var(--accent);background:none;border:0;text-decoration:none}
.ib svg{width:26px;height:26px}
.ib[aria-pressed="true"]{background:var(--done);outline:1px solid var(--gold)}
.vid{margin:0}
.tagalt{display:inline-block;margin-top:3px;font-size:12px;font-weight:600;color:var(--goldtxt);background:var(--done);border-radius:6px;padding:1px 7px}
.ssb{border-left:5px solid var(--gold)}
.sshead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.sshead b{font-family:var(--head);font-size:21px}
.sshead span{color:var(--mute);font-size:13px;text-align:right}
.mem{padding:6px 0;border-top:1px solid var(--line)}
.mem:first-of-type{border-top:0}
.lt{font-style:normal;display:inline-block;min-width:28px;text-align:center;background:var(--accent);color:var(--accent-ink);border-radius:6px;font-size:13px;padding:1px 5px;margin-right:6px;font-weight:700}
.rnd{margin-top:10px;padding-top:8px;border-top:1px dashed var(--line)}
.rl{color:var(--mute);font-size:12px;font-weight:600;margin-bottom:2px}
.cap{display:flex;gap:6px;align-items:baseline;font-size:13px;color:var(--mute);margin-top:4px}
.cap b{color:var(--ink)}
.cap .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.set.ssr{grid-template-columns:1fr 1fr 52px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;min-height:48px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:0 12px;margin:0 0 12px;font-weight:600}
.toggle .sw{position:relative;width:46px;height:26px;border-radius:13px;background:var(--line);flex:0 0 auto}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff}
.toggle[aria-checked="true"] .sw{background:var(--accent)}
.toggle[aria-checked="true"] .sw::after{left:23px}
@media (prefers-reduced-motion:no-preference){.chk,.wk,.day,.fl button{transition:background .12s,border-color .12s}}

.days{grid-template-columns:repeat(3,1fr)}
.nokg{text-align:center;color:var(--mute);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:3px}
.tags .tagalt{margin-top:0}
.tagmain,.tagath{display:inline-block;font-size:12px;font-weight:700;border-radius:6px;padding:1px 7px;letter-spacing:.2px}
.tagmain{background:var(--accent);color:var(--accent-ink)}
.tagath{background:var(--black);color:var(--gold)}
:root[data-theme="dark"] .tagath{background:#2D2829}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .tagath{background:#2D2829}}
.ex.mainex{border-left:5px solid var(--accent)}
.ex.warm{background:transparent;border-style:dashed}
.nudge.info{cursor:default;border-color:var(--gold)}
.nudge.warnbox{cursor:default;background:#FBE9E9;border-color:var(--red);color:#5c0d12}
.dl{color:var(--goldtxt)}
.liftn{font-weight:600;margin-top:10px}
.liftn small,.field small{color:var(--mute);font-weight:500}
.how p{margin:0 0 10px;font-size:15px;line-height:1.45}
.how p:last-child{margin-bottom:0}
#toTrain{margin-bottom:12px}
.st{font-family:var(--head);font-size:15px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--goldtxt);margin:16px 0 6px;display:flex;align-items:center;gap:8px}
.st::after{content:"";flex:1;height:1px;background:var(--line)}
.st.alt{color:var(--mute)}
.xnote{display:block;margin-top:3px;font-size:13px;font-weight:600;color:var(--accent)}
:root[data-theme="dark"] .xnote{color:#E0575A}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .xnote{color:#E0575A}}
.ex.circ{border-left:5px solid var(--gold)}
.items{margin-top:6px}
.item{display:flex;align-items:center;gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.item .itx{flex:1;min-width:0}
.item b{font-size:15px;display:block}
.item .ckg{width:74px;flex:0 0 74px}
.ib.sm{width:40px;height:40px;flex:0 0 40px}
.ib.sm svg{width:22px;height:22px}
.ex .rl{margin-top:10px}
.set.cr{grid-template-columns:1fr 1fr 52px}
.rlab{font-weight:600;color:var(--mute);font-size:14px}
.prog{white-space:nowrap}
.field select{width:100%;min-height:48px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;font-weight:500;padding:0 12px;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px;background-repeat:no-repeat;padding-right:36px;text-overflow:ellipsis}
.pend p{margin:0 0 10px;line-height:1.45}
.pend .btn{margin-top:4px}
.how .ver{margin-top:14px;padding-top:10px;border-top:1px solid var(--line)}
.selwrap{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:10px;padding:8px 12px;margin:10px 0 4px;font-weight:600}
.selwrap select{min-height:44px;min-width:150px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;font-weight:600;padding:0 10px}
td small{color:var(--mute)}
</style>
</head>

<script>
/* =====================================================================

   Phase 1 (Woche 1–8): Legoman Powerbuilding – 1:1 aus GymPlan_Seniors.xlsx
   Phase 2 (Woche 9–16) und Phase 3 (Woche 17–24): noch nicht ausgearbeitet
   ===================================================================== */
/* App-Version: bei jeder Änderung hier UND in sw.js (VERSION) erhöhen */
const APP_VERSION = 'v4';

/* ---------- Video-Links aus der Excel-Datei ---------- */
const YT_WU_LEG='https://www.youtube.com/watch?v=REMBaXHShL4&list=PLTjAzAtC2i0k&index=1';

};

/* ---------- Bausteine ----------
   Jede Übung wird über ihren Namen gespeichert (nicht über die Position).
   So bleiben Einträge erhalten, wenn Übungen ergänzt oder umsortiert werden. */
const L=(st,n,sets,reps,rir,note,v,unit)=>({k:'lift',st,n,sets,reps:String(reps),rir:rir!=null?String(rir):'',note:note||'',v:v||'',unit:unit||'Wdh.'});
const WU=(items)=>({k:'warm',st:'Warm-up',n:'Warm-up',rounds:2,items});
const ZI=(title,items)=>({k:'circ',st:'4-6 Runden Zirkel',n:title,rounds:6,items});
const CA=()=>[
  {k:'cardio',st:'Alternative: Cardio',n:'Warm-up (Cardio)',sets:1,unit:'Min.',ph:'10',tgt:'10 Min. · Easy Tempo',note:'z. B. easy Joggen'},
  {k:'cardio',st:'Alternative: Cardio',n:'Intervalle',sets:6,unit:'Sek.',ph:'45',tgt:'45 s Belastung · 45 s Pause · RIR 0',note:'10 Min. (ca. 6 Runden) Intervall'},
  {k:'cardio',st:'Alternative: Cardio',n:'Cool Down',sets:1,unit:'Min.',ph:'10',tgt:'10 Min.',note:'easy Jogging oder Walking'}];

/* Warm-up-Einträge: [Name, Wdh., Hinweis, Video] */
const WU_LEG_A=WU([['Deep Squat Sit','10 je Seite','Im Wechsel Knie über Zehen schieben',YT_WU_LEG],['Cossack Squat','10 je Seite','Knie vorschieben',YT_WU_LEG],['Split Squat Jumps','10','kleine Sprünge in tiefer Position',YT_WU_LEG],['Pogos','15','kurzer Bodenkontakt',YT_WU_LEG]]);
const WU_LEG_B=WU([['Deep Squat Sit','10 je Seite','Im Wechsel Knie über Zehen schieben',YT_WU_LEG],['Cossack Squat','10 je Seite','Knie vorschieben',YT_WU_LEG],['Split Squat Jumps','10','enger Stand, Knie weit vorne',YT_WU_LEG],['Pogos','15','kurzer Bodenkontakt',YT_WU_LEG]]);
const WU_LEG_D=WU([['Deep Squat Sit','10 je Seite','Im Wechsel Knie über Zehen schieben',YT_WU_LEG],['Cossack Squat','10 je Seite','Knie vorschieben',YT_WU_LEG],['Split Squat Jumps','10','kleine Sprünge in tiefer Position',YT_WU_LEG],['Pogos','15','kurzer Bodenkontakt',YT_WU_LEG]]);
const WU_UP=WU([['Katze-Kuh','10','',YT_WU_UP],['Kettlebell Scapula Press','8','Alternativ mit Dumbbell',YT_WU_UP],['Scapula Pull','8','',YT_WU_UP]]);

/* Zirkel-Stationen: [Name, Belastung, Pause, Hinweis, Video] */
const ZI_KB=ZI('Power Kettlebell Zirkel',[
  ['B-Stance Kettlebell Swing','30 s','40-60 s','Gewicht immer über Standfuß halten','https://www.youtube.com/shorts/XmM5ATfWB0E'],
  ['Floor Press reziprok','30 s','40-60 s','im Glute Bridge Hold','https://www.youtube.com/shorts/gCVNgReCkmw'],
  ['Weighted Cossack Squat','30 s','40-60 s','Knie so weit wie möglich vorschieben','https://www.youtube.com/shorts/J87bPGxEY4s'],
  ['Vorgebeugtes Rudern reziprok','30 s','40-60 s','Oberkörper parallel zum Boden','https://www.youtube.com/shorts/0Pz65dfeCe8'],
  ['Deep Squat Shoulder Press reziprok','30 s','60 s','Oberkörper rotiert komplett mit','https://www.youtube.com/shorts/qTJiA0UeKic']]);
const ZI_DB_ST=(pushNote)=>ZI('Power Dumbbell Zirkel',[
  ['B-Stance Dumbbell Deadlift','30 s','40-60 s','Gewicht immer über Standfuß halten','https://www.youtube.com/shorts/Z1pvHbs99cQ'],
  ['Liegestütz','30 s','40-60 s',pushNote,'https://www.youtube.com/shorts/0qTQOFf6v1Q'],
  ['Goblet Squat','30 s','40-60 s','Knie so weit wie möglich vorschieben','https://www.youtube.com/shorts/_8PYMTCgwKM'],
  ['Vorgebeugtes Rudern reziprok','30 s','40-60 s','Oberkörper parallel zum Boden','https://www.youtube.com/shorts/0Pz65dfeCe8'],
  ['Rotational Shoulder Press sitzend','30 s','60 s','einarmig; Oberkörper rotiert komplett mit','https://www.youtube.com/shorts/WE4PFxsCS40']]);

const DAY=(t,desc,ex)=>({t,desc,ex});
/* Legoman Powerbuilding 1 – Woche 1 und 3 (a) */
const P1A=[
 DAY('Lower Body – Strong Hips','Tag 1a',[WU_LEG_A,
   L('Mainlift','Backsquat',2,6,2,'Lift heavy!!!',YT.backsquat),
   L('Skills','Lateral Lunge Yielding Drop and Catch',2,8,'3-4','Knie immer über Fuß lassen, Hüfte schiebt raus',YT.lateral),
   L('Hypertrophie','Landmine B-Stance Deadlift',2,'6-8','0-1','Ipsilateral, Hinge the Hip',YT.bstance),
   L('Hypertrophie','Leg Press',2,6,'0-1','',YT_LEGPRESS),
   L('Hypertrophie','Beinbeuger',2,8,'0-1','Nur machen, wenn noch Power',YT_LEGPRESS)]),
 DAY('Upper Body – Push it','Tag 2a',[WU_UP,
   L('Mainlift','Bench Press',2,6,2,'',YT.bench),
   L('Skills','Landmine Coil Press',3,8,3,'',YT.coil),
   L('Hypertrophie','Reziproke Kombi',2,8,1,'Supersatz: Dumbbell Pos. Bankdrücken + vorgebeugtes Rudern',YT.rezi),
   L('Hypertrophie','Lat-Zug eng',2,8,'0-1','Full Stretch, Schulterblätter gehen mit',YT.lat),
   L('Hypertrophie','Dips',2,'Alle',0,'',YT.dips),
   L('Hypertrophie','Straddle',2,6,'0-1','HEAVY!!! Hüfte bleibt stabil',YT.straddle)]),
 DAY('Kraftzirkel oder Cardio','Tag 3',[ZI_KB,...CA()])];
/* Legoman Powerbuilding 1 – Woche 2 und 4 (b) */
const P1B=[
 DAY('Lower Body – Strong Legs','Tag 1b',[WU_LEG_B,
   L('Mainlift','Front- / Safety-Bar Squat',2,6,2,'Gerne mit Keil unter den Füßen',YT.front),
   L('Skills','Sit down Pistol Squat',2,8,3,'Langsam runter, explosiv hoch',YT.pistol),
   L('Hypertrophie','Landmine B-Stance Deadlift',2,'6-8','0-1','Ipsilateral, Hinge the Hip',YT.bstance),
   L('Hypertrophie','Leg Press',2,6,'0-1','',YT_LEGPRESS),
   L('Hypertrophie','Beinstrecker',2,8,'0-1','Nur machen, wenn noch Power',YT_LEGPRESS)]),
 DAY('Upper Body – Pull it','Tag 2b',[WU_UP,
   L('Mainlift','Vorgebeugtes Rudern Langhantel',2,6,1,'',YT.row),
   L('Skills','Kneeling Rotational Row',3,8,2,'Single Arm Row, contralateral',YT.kneelrow),
   L('Hypertrophie','Dumbbell Pos. Bench reziprok',2,8,1,'',YT.rezi),
   L('Hypertrophie','Lat-Zug eng',2,8,'0-1','Full Stretch, Schulterblätter gehen mit',YT.lat),
   L('Hypertrophie','Dips',2,'Alle',0,'',YT.dips),
   L('Hypertrophie','Straddle',2,6,'0-1','HEAVY!!! Hüfte bleibt stabil',YT.straddle)]),
 DAY('Kraftzirkel oder Cardio','Tag 3',[ZI_DB_ST('im Glute Bridge Hold'),...CA()])];
/* Legoman Powerbuilding 2 – Woche 5 und 7 (a) */
const P2A=[
 DAY('Lower Body – Strong Hips','Tag 1a',[WU_LEG_A,
   L('Mainlift','Deadlift',2,6,1,'Lift heavy!!!'),
   L('Skills','Landmine Reverse Curtsy Lunge',2,8,2,'Schnell nach hinten fallen lassen und CATCH!',YT.curtsy),
   L('Skills','Lateral Lunge Yielding Drop and Catch',2,8,2,'Knie immer über Fuß lassen, Hüfte schiebt raus',YT.lateral),
   L('Hypertrophie','Single Leg Hamstring Hold',2,'30-40','0-1','Glute Bridge, aber Füße weiter entfernt',YT.hamhold,'Sek.'),
   L('Hypertrophie','Leg Press',2,6,'0-1','',YT_LEGPRESS)]),
 DAY('Upper Body – Push it','Tag 2a',[WU_UP,
   L('Mainlift','Bench Press',2,6,2,'',YT.bench),
   L('Skills','Landmine Rotational Pull-Push',2,8,3,'','https://www.youtube.com/shorts/CcFfSwIHThg'),
   L('Skills','Landmine Core Rotation',2,8,3,'Fallen lassen und catchen',YT.corerot),
   L('Hypertrophie','Dumbbell Pos. Bench reziprok',2,8,1,'',YT.rezi2),
   L('Hypertrophie','Lat-Zug eng',2,8,'0-1','Full Stretch, Schulterblätter gehen mit',YT.lat),
   L('Hypertrophie','Dips',2,'Alle',0,'',YT.dips)]),
 DAY('Kraftzirkel oder Cardio','Tag 3',[ZI_KB,...CA()])];
/* Legoman Powerbuilding 2 – Woche 6 und 8 (b) */
const P2B=[
 DAY('Lower Body – Strong Legs','Tag 1b',[WU_LEG_D,
   L('Mainlift','Squat',2,6,1,'Egal ob Front- oder Backsquat',YT.backsquat),
   L('Skills','Sit down Pistol Squat',2,8,2,'Langsam runter, explosiv hoch',YT.pistol),
   L('Skills','Landmine Squat to Push',2,8,2,'Fast Push!',YT.sq2push),
   L('Hypertrophie','FFE Split Squat Iso Hold',2,'30-40','0-1','Front Foot only on Forefoot; Knie vorschieben',YT.ffe,'Sek.'),
   L('Hypertrophie','Leg Press',2,6,'0-1','',YT_LEGPRESS),
   L('Hypertrophie','Beinstrecker',2,8,'0-1','Nur machen, wenn noch Power',YT_LEGPRESS)]),
 DAY('Upper Body – Pull it','Tag 2b',[WU_UP,
   L('Mainlift','Vorgebeugtes Rudern Langhantel',2,6,1,'',YT.row),
   L('Skills','Kneeling Rotational Row',2,8,2,'Single Arm Row, contralateral',YT.kneelrow),
   L('Skills','Single Arm Lat Pull + Shoulder Press',2,8,2,'Reziprok – 1 Arm Pull, der andere Push',YT.latpress),
   L('Hypertrophie','Dumbbell Pos. Bench reziprok',2,8,1,'',YT.rezi),
   L('Hypertrophie','Dips',2,'Alle',0,'',YT.dips),
   L('Hypertrophie','Straddle',2,6,'0-1','HEAVY!!! Hüfte bleibt stabil',YT.straddle)]),
 DAY('Kraftzirkel oder Cardio','Tag 3',[ZI_DB_ST(''),...CA()])];

/* ---------- 24 Wochen, 3 Phasen ----------
   Neue Phase einpflegen: Wochen in PLAN eintragen (9–16 bzw. 17–24), Name in PHASES setzen. */
const PHASES=[
  {id:1,name:'Phase 1',sub:'Legoman Powerbuilding',from:1},
  {id:2,name:'Phase 2',sub:'in Planung',from:9},
  {id:3,name:'Phase 3',sub:'in Planung',from:17}];
const PLAN={1:P1A,2:P1B,3:P1A,4:P1B,5:P2A,6:P2B,7:P2A,8:P2B};
const BLOCK_NAME={1:'Legoman Powerbuilding 1',2:'Legoman Powerbuilding 1',3:'Legoman Powerbuilding 1',4:'Legoman Powerbuilding 1',5:'Legoman Powerbuilding 2',6:'Legoman Powerbuilding 2',7:'Legoman Powerbuilding 2',8:'Legoman Powerbuilding 2'};
const phaseOf=w=>w>=17?3:w>=9?2:1;
const phaseReady=p=>{const f=PHASES[p-1].from; for(let w=f;w<f+8;w++) if(PLAN[w]) return true; return false;};
const relWeek=w=>w-PHASES[phaseOf(w)-1].from+1;
const LIFTS=['Backsquat','Front- / Safety-Bar Squat','Squat','Deadlift','Bench Press','Vorgebeugtes Rudern Langhantel'];

const KEY='alligators-team-legoman-v1';
const DAYS=['Mo','Do','Sa'];
const FEEL=['Schlecht','Eher schlecht','Okay','Gut','Sehr gut'];
const POS=['Quarterback (QB)','Running Back (RB)','Fullback (FB)','Wide Receiver (WR)','Tight End (TE)','Offensive Line (OL)','Defensive Line (DL)','Linebacker (LB)','Cornerback (CB)','Safety (S)','Kicker / Punter (K/P)','Long Snapper (LS)'];
function lsGet(){try{return localStorage.getItem(KEY)}catch(e){return null}}
function lsSet(v){try{localStorage.setItem(KEY,v)}catch(e){}}
const defaults=()=>({sv:3,sets:{},ckg:{},feel:{},note:{},exnote:{},date:{},sat:{},phase:1,profile:{name:'',num:'',pos:''},ui:{w:1,d:0},ts:0});
let state=defaults();
try{const raw=lsGet(); if(raw){const p=JSON.parse(raw); if(p&&p.sets){state=Object.assign(defaults(),p); state.profile=Object.assign(defaults().profile,p.profile||{}); if(!p.sv) state.sv=2;}}}catch(e){}

/* ---------- Umzug alter Einträge (bis v2: Speicherung nach Position) ---------- */
const OLD_V2={
 A:[['Warm-up','Backsquat','Lateral Lunge Yielding Drop and Catch','Romanian Deadlift','Leg Press','Beinbeuger'],['Warm-up','Bench Press','Landmine Rotational Push','Dumbbell Pos. Bench reziprok','Lat-Zug eng','Dips','Straddle'],['Power Kettlebell Zirkel','Warm-up (Cardio)','Intervalle','Cool Down']],
 B:[['Warm-up','Frontsquat','Sit down Pistol Squat','Romanian Deadlift','Leg Press','Beinstrecker'],['Warm-up','Vorgebeugtes Rudern Langhantel','Kneeling Rotational Row','Dumbbell Pos. Bench reziprok','Lat-Zug eng','Dips','Straddle'],['Power Dumbbell Zirkel','Warm-up (Cardio)','Intervalle','Cool Down']],
 C:[['Warm-up','B-Stance Landmine RDL ipsilateral','Landmine Reverse Curtsy Lunge','Lateral Lunge Yielding Drop and Catch','Single Leg Hamstring Hold','Leg Press'],['Warm-up','Bench Press','Landmine Rotational Pull-Push','Landmine Core Rotation','Dumbbell Pos. Bench reziprok','Lat-Zug eng','Dips'],['Power Kettlebell Zirkel','Warm-up (Cardio)','Intervalle','Cool Down']],
 D:[['Warm-up','Squat','Sit down Pistol Squat','Landmine Squat to Push','FFE Split Squat Iso Hold','Leg Press','Beinstrecker'],['Warm-up','Vorgebeugtes Rudern Langhantel','Kneeling Rotational Row','Single Arm Lat Pull + Shoulder Press','Dumbbell Pos. Bench reziprok','Dips','Straddle'],['Power Dumbbell Zirkel','Warm-up (Cardio)','Intervalle','Cool Down']]};
const OLD_WEEK={1:'A',2:'B',3:'A',4:'B',5:'C',6:'D',7:'C',8:'D'};
const RENAMED={'Frontsquat':'Front- / Safety-Bar Squat'};
function migrate(){
  if(state.sv>=3) return false;
  const sets={}, exnote={};
  for(const s of Object.values(state.sets||{})){
    const n=RENAMED[s.n]||s.n; const o=Object.assign({},s,{n});
    sets[`${s.w}|${s.d}|${n}|${s.i}`]=o;
  }
  for(const [k,v] of Object.entries(state.exnote||{})){
    const [w,d,e]=k.split('|'); const tab=OLD_V2[OLD_WEEK[w]]; const nm=tab&&tab[d]&&tab[d][e];
    if(nm&&v) exnote[`${w}|${d}|${RENAMED[nm]||nm}`]=v;
  }
  state.sets=sets; state.exnote=exnote; state.sv=3; return true;
}
if(migrate()) lsSet(JSON.stringify(state));

const profEmpty=()=>!state.profile.name.trim()&&!state.profile.num&&!state.profile.pos.trim();
/* Beim ersten Start (Profil leer) zuerst Profil, sonst immer Training */
let tab=profEmpty()?'prof':'train', W=state.ui.w||1, D=state.ui.d||0;
if(W<1||W>24) W=1;
if(phaseOf(W)!==state.phase) W=PHASES[state.phase-1].from;
if(PLAN[W]&&!PLAN[W][D]) D=0;
const firstRun=tab==='prof';
const K=(w,d,n,i)=>`${w}|${d}|${n}|${i}`;
const SK=(w,d)=>`${w}|${d}`;
const EK=(w,d,n)=>`${w}|${d}|${n}`;
const num=v=>{const x=parseFloat(String(v).replace(',','.'));return isNaN(x)?null:x};
const fmt=x=>x==null?'':(Math.round(x*10)/10).toString().replace('.',',');
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function save(){state.ts=Date.now(); state.ui={w:W,d:D}; lsSet(JSON.stringify(state));}
let storageOk=true; try{const t='__t';localStorage.setItem(t,'1');localStorage.removeItem(t);}catch(e){storageOk=false;}

/* ---------- Helfer ---------- */
const nRows=x=>x.k==='lift'||x.k==='cardio'?x.sets:x.rounds;
const ph=x=>x.k==='lift'?(x.reps==='Alle'?'max':x.reps.split('-')[0]):x.ph||'';
function tgt(x){
  if(x.k==='lift') return `${x.sets}×${x.reps==='Alle'?'alle (max.)':x.reps+(x.unit==='Sek.'?' s':'')}${x.rir!==''?' · RIR '+x.rir:''}`;
  return x.tgt||'';
}
const ord=(w,d,i)=>(w*10+d)*100+i;
function lastKg(name,w,d,i){
  const cur=ord(w,d,i); let best=-1,val=null;
  for(const s of Object.values(state.sets)){
    if(s.n!==name||!(s.kg>0)||!s.done) continue;
    const o=ord(s.w,s.d,s.i);
    if(o<cur&&o>best){best=o;val=s.kg;}
  }
  return val;
}
function lastCkg(name,w){
  for(let ww=w;ww>=1;ww--) for(let d=0;d<3;d++){const v=state.ckg[`${ww}|${d}|${name}`]; if(v!=null&&!(ww===w&&d===D)) return v;}
  return null;
}
function today(){const t=new Date();return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');}
function videoUrl(name,v){
  if(v) return v;
  return 'https://www.youtube.com/results?search_query='+encodeURIComponent(name.replace(/\(.*?\)/g,'').replace(/[\/+]/g,' ').trim()+' exercise');
}
function whoText(){
  const p=state.profile; const parts=[];
  if(p.name) parts.push(p.name); if(p.num) parts.push('#'+p.num); if(p.pos) parts.push(p.pos);
  return parts.length?parts.join(' · '):'Offseason · 24 Wochen';
}
const exOf=(w,d)=>PLAN[w]&&PLAN[w][d]?PLAN[w][d].ex:[];
const findEx=(w,d,n)=>exOf(w,d).find(x=>x.n===n);
const posOf=(w,d,n)=>{const i=exOf(w,d).findIndex(x=>x.n===n); return i<0?99:i;};

/* ---------- Kopf ---------- */
function renderCtrl(){
  const show=tab==='train'&&!!PLAN[W];
  document.getElementById('ctrl').style.display=show?'':'none';
  document.getElementById('whoLine').textContent=whoText();
  if(!show) return;
  const f=PHASES[state.phase-1].from; let h='';
  for(let w=f;w<f+8;w++) h+=`<button class="wk" data-w="${w}" aria-pressed="${w===W}" aria-label="Woche ${relWeek(w)}">${relWeek(w)}</button>`;
  document.getElementById('weeks').innerHTML=h;
  h='';
  PLAN[W].forEach((dy,i)=>{
    const any=Object.values(state.sets).some(s=>s.w===W&&s.d===i&&s.done);
    h+=`<button class="day" data-d="${i}" aria-pressed="${i===D}" aria-label="${DAYS[i]} – ${esc(dy.t)}">${DAYS[i]}${any?'<span class="dot"></span>':''}</button>`;
  });
  document.getElementById('days').innerHTML=h;
  const a=document.querySelector('#weeks [aria-pressed="true"]'); if(a&&a.scrollIntoView) a.scrollIntoView({inline:'center',block:'nearest'});
}

/* ---------- Training ---------- */
function doneIn(filter){return exOf(W,D).reduce((acc,x)=>{if(!filter(x))return acc;for(let i=0;i<nRows(x);i++){acc[1]++;const s=state.sets[K(W,D,x.n,i)];if(s&&s.done)acc[0]++;}return acc;},[0,0]);}
function countDone(){
  const ex=exOf(W,D);
  if(!ex.some(x=>x.k==='cardio')) return doneIn(()=>true);
  return satMode()==='cardio'?doneIn(x=>x.k==='cardio'):doneIn(x=>x.k!=='cardio');
}
/* Tag 3: Auswahl Kraftzirkel / Cardio per Drop-down (pro Woche gespeichert) */
function satMode(){
  const v=(state.sat||{})[SK(W,D)]; if(v) return v;
  const c=doneIn(x=>x.k==='cardio'), z=doneIn(x=>x.k!=='cardio');
  return c[0]>0&&z[0]===0?'cardio':'zirkel';
}
const PLAY='<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="4" fill="currentColor"/><path d="M10 9.2v5.6l5-2.8z" fill="#fff"/></svg>';

/* ---------- Verlauf ---------- */
function stats(){
  const wk={}; for(let w=1;w<=24;w++) wk[w]={sets:0,vol:0,e1:{},feel:[],days:new Set()};
  for(const s of Object.values(state.sets)){
    if(!s.done) continue; const o=wk[s.w]; if(!o) continue;
    o.days.add(s.d);
    if(s.k!=='lift') continue;
    o.sets++;
    if(s.kg>0&&s.reps>0) o.vol+=s.kg*s.reps;
    if(s.kg>0&&s.reps>0&&s.reps<=12&&LIFTS.includes(s.n)){const v=s.kg*(1+s.reps/30); if(!(o.e1[s.n]>=v)) o.e1[s.n]=v;}
  }
  for(const [k,v] of Object.entries(state.feel)){const w=+k.split('|')[0]; if(wk[w]&&v!=null) wk[w].feel.push(v);}
  return wk;
}

  h+=`<div class="card"><h3>Wochenübersicht · ${esc(ph1.name)}</h3><div class="scroll"><table><tr><th>Woche</th><th>Tage</th><th>Sätze</th><th>Vol. kg</th><th>Ø Bef.</th></tr>`;
  for(let w=f;w<f+8;w++){const o=wk[w];const avg=o.feel.length?o.feel.reduce((a,b)=>a+b,0)/o.feel.length:null;
    h+=`<tr><td>W${relWeek(w)}</td><td>${o.days.size?o.days.size+' / 3':'–'}</td><td>${o.sets||'–'}</td><td>${o.vol?Math.round(o.vol).toLocaleString('de-DE'):'–'}</td><td>${avg!=null?fmt(avg):'–'}</td></tr>`;}
  h+='</table></div><p class="small">Sätze und Volumen zählen Mainlift, Skills und Hypertrophie (ohne Warm-up, Zirkel und Cardio). Die Phase wechselst du im Profil.</p></div>';
  const vmax=Math.max(...Object.values(wk).map(o=>o.vol));
  h+='<div class="card"><h3>Volumen pro Woche</h3>';
  if(vmax>0){for(let w=1;w<=24;w++){const v=wk[w].vol; if(!v) continue; h+=`<div class="bar"><span>${barLab(w)}</span><i style="width:${Math.max(v/vmax*100,3)}%"></i><span>${(v/1000).toLocaleString('de-DE',{maximumFractionDigits:1})} t</span></div>`;}}
  else h+='<div class="empty">Noch keine Sätze mit Gewicht.</div>';

  h+='<div class="card"><h3>Körperbefinden pro Woche (Ø, 1–5)</h3>';
  let any=false;
  for(let w=1;w<=24;w++){const o=wk[w]; if(!o.feel.length) continue; any=true; const a=o.feel.reduce((x,y)=>x+y,0)/o.feel.length;
    h+=`<div class="bar g"><span>${barLab(w)}</span><i style="width:${Math.max(a/5*100,3)}%"></i><span>${fmt(a)}</span></div>`;}
  if(!any) h+='<div class="empty">Noch keine Einträge.</div>';

  h+='<div class="card"><h3>Geschätztes 1RM Mainlifts (kg)</h3>';

    vals.forEach(([w,v])=>{h+=`<div class="bar"><span>${barLab(w)}</span><i style="width:${Math.max(v/mx*100,3)}%"></i><span>${fmt(v)}</span></div>`;});
  });
  if(!anyL) h+='<div class="empty">Noch keine Sätze der Mainlifts (bis 12 Wdh.).</div>';

  h+=`<button class="btn" id="exp">Log als CSV an die Coaches senden</button><p class="small">Auf dem Handy öffnet sich das Teilen-Menü (z. B. WhatsApp oder Mail), sonst wird die Datei gespeichert. Die Datei enthält alle Phasen, Name, Trikotnummer und Position und lässt sich in Excel oder Google Sheets öffnen.</p>`;

  document.getElementById('main').innerHTML=h;
}
const barLab=w=>`P${phaseOf(w)} W${relWeek(w)}`;
function buildCsv(){
  const p=state.profile;
  const rows=[['Name','Trikotnummer','Position','Datum','Phase','Woche (Phase)','Gesamtwoche','Plan','Tag','Einheit','Station','Übung','Satz/Runde','Gewicht (kg)','Wert','Einheit Wert','Notiz zur Übung','Körperbefinden (1-5)','Notiz zur Einheit']];
  const out=[];
  const base=(w,d)=>{const sk=SK(w,d);return [p.name,p.num,p.pos,state.date[sk]||'',PHASES[phaseOf(w)-1].name,relWeek(w),w,BLOCK_NAME[w]||'',DAYS[d],PLAN[w]&&PLAN[w][d]?PLAN[w][d].t:''];};
  const tail=(w,d,note)=>{const sk=SK(w,d);return [note||'',state.feel[sk]!=null?state.feel[sk]:'',state.note[sk]||''];};
  const used=new Set();
  for(const s of Object.values(state.sets)){
    if(!s.done) continue; const x=findEx(s.w,s.d,s.n);
    used.add(SK(s.w,s.d));
    const k=x?x.k:s.k;
    const lab=k==='lift'?s.i+1:(k==='cardio'&&x&&x.sets===1?'':'Runde '+(s.i+1));
    out.push([ord(s.w,s.d,0)*100+posOf(s.w,s.d,s.n)*20+s.i,[...base(s.w,s.d),x?x.st:'',k==='warm'?'Warm-up (alle Übungen)':s.n+(x?'':' (frühere Planversion)'),lab,s.kg!=null?fmt(s.kg):'',s.reps!=null?fmt(s.reps):'',x&&(x.k==='lift'||x.k==='cardio')?x.unit:'',...tail(s.w,s.d,state.exnote[EK(s.w,s.d,s.n)])]]);
  }
  for(const [k,v] of Object.entries(state.ckg)){
    if(v==null) continue; const [w,d,nm]=k.split('|'); const ww=+w, dd=+d;
    const c=exOf(ww,dd).find(x=>x.k==='circ');
    out.push([ord(ww,dd,0)*100+posOf(ww,dd,c?c.n:'')*20+19,[...base(ww,dd),'4-6 Runden Zirkel',nm,'Gewicht Station',fmt(v),'','',...tail(ww,dd,'')]]);
    used.add(SK(ww,dd));
  }
  Object.keys(state.exnote).forEach(k=>{const [w,d,n]=k.split('|'); const ww=+w, dd=+d; if(!state.exnote[k]) return;
    if(Object.values(state.sets).some(s=>s.done&&s.w===ww&&s.d===dd&&s.n===n)) return;
    const x=findEx(ww,dd,n); out.push([ord(ww,dd,0)*100+posOf(ww,dd,n)*20,[...base(ww,dd),x?x.st:'',n,'','','','',...tail(ww,dd,state.exnote[k])]]); used.add(SK(ww,dd));});
  Object.keys(Object.assign({},state.feel,state.note)).forEach(sk=>{if(used.has(sk))return; const [w,d]=sk.split('|').map(Number);
    out.push([ord(w,d,0)*100,[...base(w,d),'','','','','','',...tail(w,d,'')]]);});
  out.sort((a,b)=>a[0]-b[0]).forEach(r=>rows.push(r[1]));
  return '﻿'+rows.map(r=>r.map(c=>{c=String(c==null?'':c);return /[;"\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;}).join(';')).join('\r\n');
}
function csvName(){
  const p=state.profile; const nm=(p.name||'spieler').trim().replace(/\s+/g,'_').replace(/[^\wäöüÄÖÜß_-]/g,'');
  return `alligators_log_${p.num?p.num+'_':''}${nm}_${today()}.csv`;
}
async function exportCsv(){
  const csv=buildCsv(), fn=csvName();
  try{
    const dl=window.claude&&claude.use?await claude.use('downloads'):null;
    if(dl){ await dl.save({filename:fn,data:csv}); return; }
  }catch(e){}
  try{
    const file=new File([csv],fn,{type:'text/csv'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'Alligators Trainingslog'}); return; }
  }catch(e){ if(e&&e.name==='AbortError') return; }
  try{ const a=document.createElement('a'); a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv); a.download=fn; document.body.appendChild(a); a.click(); a.remove(); }catch(e){}
}

    if(t.value==='__other'){ wrap.style.display=''; state.profile.pos=inp.value.trim(); inp.focus(); }
    else { wrap.style.display='none'; state.profile.pos=t.value; }
    save(); whoUpd(); return;
  }
  if(t.id==='pPhase'){
    state.phase=+t.value; W=PHASES[state.phase-1].from; D=0; save(); return;
  }
});
mainEl.addEventListener('click',ev=>{
  if(ev.target.id==='goProf'||ev.target.id==='goProf2'){go('prof');return;}
  if(ev.target.id==='toTrain'){go('train');return;}
  const c=ev.target.closest('.chk');
  if(c){
    const row=c.closest('.set'); const s=setObj(row);
    const kgI=row.querySelector('.kg'), rpI=row.querySelector('.rp');
    if(!s.done){
      if(kgI&&s.kg==null&&num(kgI.placeholder)!=null){s.kg=num(kgI.placeholder);kgI.value=s.kg;}
      if(rpI&&s.reps==null&&num(rpI.placeholder)!=null){s.reps=num(rpI.placeholder);rpI.value=s.reps;}
      s.done=true; if(!state.date[SK(W,D)]) state.date[SK(W,D)]=today();
    } else s.done=false;
    row.classList.toggle('done',s.done); c.textContent=s.done?'✓':'○'; c.setAttribute('aria-pressed',s.done);
    const [dn,t]=countDone(); document.getElementById('prog').textContent=dn+' / '+t;
    save();
    const dd=document.querySelector(`#days [data-d="${D}"]`); if(dd){const any=Object.values(state.sets).some(x=>x.w===W&&x.d===D&&x.done); const dot=dd.querySelector('.dot'); if(any&&!dot) dd.insertAdjacentHTML('beforeend','<span class="dot"></span>'); if(!any&&dot) dot.remove();}
    return;
  }
  const f=ev.target.closest('[data-f]');
  if(f){
    const sk=SK(W,D), v=+f.dataset.f;
    if(state.feel[sk]===v) delete state.feel[sk]; else { state.feel[sk]=v; if(!state.date[sk]) state.date[sk]=today(); }
    const cur=state.feel[sk];
    document.querySelectorAll('.fl button').forEach(b=>b.setAttribute('aria-pressed',+b.dataset.f===cur));
    document.getElementById('fsel').textContent=cur?cur+' · '+FEEL[cur-1]:'';
    save(); return;
  }
  if(ev.target.id==='exp') exportCsv();
});
render();
